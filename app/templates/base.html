<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SGE - Sistema de Gestão de Estoque{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              950: '#0a0f1c',
              900: '#0d1b2e',
              800: '#11213a',
              700: '#172a44',
              600: '#22354f',
            },
          },
          animation: {
            'fade-in': 'fadeIn 0.6s ease-out',
            'slide-in-left': 'slideInLeft 0.5s ease-out',
            'slide-in-right': 'slideInRight 0.5s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            slideInLeft: {
              '0%': { opacity: '0', transform: 'translateX(-20px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' }
            },
            slideInRight: {
              '0%': { opacity: '0', transform: 'translateX(20px)' },
              '100%': { opacity: '1', transform: 'translateX(0)' }
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Identidade Ephyra: fundo navy + acento sky-500 (#0ea5e9), como custom
       properties para facilitar ajustes futuros de paleta. */
    :root {
      --ephyra-navy-950: #0a0f1c;
      --ephyra-navy-900: #0d1b2e;
      --ephyra-surface: #11213a;
      --ephyra-border: rgba(148, 163, 184, 0.14);
      --ephyra-accent: #0ea5e9;
      --ephyra-accent-hover: #0284c7;
      --ephyra-secondary: #8b5cf6;
    }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden bg-gradient-to-br from-navy-950 via-navy-900 to-navy-950 flex flex-col">

  <!-- Background decoration -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-40 -left-40 w-80 h-80 bg-sky-500 rounded-full mix-blend-multiply filter blur-xl opacity-10 animate-pulse-slow"></div>
    <div class="absolute -bottom-40 -right-40 w-80 h-80 bg-sky-600 rounded-full mix-blend-multiply filter blur-xl opacity-10 animate-pulse-slow"></div>
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-5 animate-pulse-slow"></div>
  </div>

  <!-- Header -->
  {% include 'components/_header.html' %}

  <!-- Main Layout -->
  <div class="flex relative z-10 flex-1">
    <!-- Sidebar -->
    {% if user.is_authenticated %}
      {% include 'components/_sidebar.html' %}
    {% endif %}

    <!-- Main Content -->
    <main class="flex-1 min-w-0 {% if user.is_authenticated %}ml-0 lg:ml-64{% endif %} transition-all duration-300">
      <div class="p-4 lg:p-8 min-h-full">
        <div class="max-w-7xl mx-auto">
          {% block content %}
          {% endblock %}
        </div>
      </div>
    </main>
  </div>

  <!-- Footer -->
  {% include 'components/_footer.html' %}
</body>

</html>
