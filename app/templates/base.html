{% load static %}<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SGE - Sistema de Gestão de Estoque{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>

<body class="min-h-screen overflow-x-hidden bg-navy-950 font-sans text-ice flex flex-col">

  <!-- Signature background: quiet technical grid, no animated blobs -->
  <div class="bg-field"></div>

  <!-- Header -->
  {% include 'components/_header.html' %}

  <!-- Main Layout -->
  <div class="flex relative z-10 flex-1">
    <!-- Sidebar -->
    {% if user.is_authenticated %}
      {% include 'components/_sidebar.html' %}
    {% endif %}

    <!-- Main Content -->
    <main class="flex-1 min-w-0 {% if user.is_authenticated %}ml-0 lg:ml-64{% endif %} transition-all duration-300">
      <div class="p-4 lg:p-8 min-h-full">
        <div class="max-w-7xl mx-auto">
          {% block content %}
          {% endblock %}
        </div>
      </div>
    </main>
  </div>

  <!-- Footer -->
  {% include 'components/_footer.html' %}
</body>

</html>
