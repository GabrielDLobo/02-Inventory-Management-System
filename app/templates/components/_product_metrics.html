<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-8">

  <!-- Total Quantity Card -->
  <div class="bg-navy-800/60 backdrop-blur-xl border border-slate-700/50 rounded-xl p-8 hover:border-sky-500/30 transition-all duration-300">
    <div class="flex items-center justify-between mb-6">
      <div class="w-12 h-12 bg-gradient-to-br from-sky-400 to-sky-600 rounded-xl flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
        </svg>
      </div>
    </div>
    <p class="text-sm font-medium text-slate-400 mb-2">Quantidade de Produtos</p>
    <p class="text-4xl font-bold text-white mb-4">{{ product_metrics.total_quantity }}</p>
    <div class="w-full bg-navy-700/50 rounded-full h-1.5">
      <div class="bg-gradient-to-r from-sky-400 to-sky-600 h-1.5 rounded-full" style="width: 100%"></div>
    </div>
  </div>

  <!-- Total Cost Card -->
  <div class="bg-navy-800/60 backdrop-blur-xl border border-slate-700/50 rounded-xl p-8 hover:border-purple-500/30 transition-all duration-300">
    <div class="flex items-center justify-between mb-6">
      <div class="w-12 h-12 bg-gradient-to-br from-purple-400 to-purple-600 rounded-xl flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"></path>
        </svg>
      </div>
    </div>
    <p class="text-sm font-medium text-slate-400 mb-2">Custo do Estoque</p>
    <p class="text-4xl font-bold text-white mb-4">R$ {{ product_metrics.total_cost_price }}</p>
    <div class="w-full bg-navy-700/50 rounded-full h-1.5">
      <div class="bg-gradient-to-r from-purple-400 to-purple-600 h-1.5 rounded-full" style="width: 85%"></div>
    </div>
  </div>

  <!-- Total Selling Price Card -->
  <div class="bg-navy-800/60 backdrop-blur-xl border border-slate-700/50 rounded-xl p-8 hover:border-sky-500/30 transition-all duration-300">
    <div class="flex items-center justify-between mb-6">
      <div class="w-12 h-12 bg-gradient-to-br from-sky-400 to-sky-600 rounded-xl flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 8h6m-5 0a3 3 0 110 6H9l3 3-3-3zm1 3h4m-4 0a3 3 0 104 0m-4 0v3m4-3v3"></path>
        </svg>
      </div>
    </div>
    <p class="text-sm font-medium text-slate-400 mb-2">Valor do Estoque</p>
    <p class="text-4xl font-bold text-white mb-4">R$ {{ product_metrics.total_selling_price }}</p>
    <div class="w-full bg-navy-700/50 rounded-full h-1.5">
      <div class="bg-gradient-to-r from-sky-400 to-sky-600 h-1.5 rounded-full" style="width: 95%"></div>
    </div>
  </div>

  <!-- Total Profit Card (semântico: lucro = verde) -->
  <div class="bg-navy-800/60 backdrop-blur-xl border border-slate-700/50 rounded-xl p-8 hover:border-green-500/30 transition-all duration-300">
    <div class="flex items-center justify-between mb-6">
      <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-green-600 rounded-xl flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
        </svg>
      </div>
    </div>
    <p class="text-sm font-medium text-slate-400 mb-2">Lucro do Estoque</p>
    <p class="text-4xl font-bold text-white mb-4">R$ {{ product_metrics.total_profit }}</p>
    <div class="w-full bg-navy-700/50 rounded-full h-1.5">
      <div class="bg-gradient-to-r from-green-400 to-green-600 h-1.5 rounded-full" style="width: 70%"></div>
    </div>
  </div>

</div>
