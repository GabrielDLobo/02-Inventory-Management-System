<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">

  <!-- Total Quantity Card -->
  <div class="bg-navy-800 border border-navy-700 rounded-card p-8 hover:border-sky-500/40 transition-colors duration-200">
    <div class="w-11 h-11 rounded-control bg-sky-500/15 flex items-center justify-center mb-6">
      <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
      </svg>
    </div>
    <p class="text-xs font-bold uppercase tracking-wider text-mist mb-2">Quantidade de Produtos</p>
    <p class="font-display font-extrabold text-5xl text-ice tabular-nums">{{ product_metrics.total_quantity }}</p>
  </div>

  <!-- Total Cost Card -->
  <div class="bg-navy-800 border border-navy-700 rounded-card p-8 hover:border-purple-500/40 transition-colors duration-200">
    <div class="w-11 h-11 rounded-control bg-purple-500/15 flex items-center justify-center mb-6">
      <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"></path>
      </svg>
    </div>
    <p class="text-xs font-bold uppercase tracking-wider text-mist mb-2">Custo do Estoque</p>
    <p class="font-display font-extrabold text-5xl text-ice tabular-nums">R$ {{ product_metrics.total_cost_price }}</p>
  </div>

  <!-- Total Selling Price Card -->
  <div class="bg-navy-800 border border-navy-700 rounded-card p-8 hover:border-sky-500/40 transition-colors duration-200">
    <div class="w-11 h-11 rounded-control bg-sky-500/15 flex items-center justify-center mb-6">
      <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 8h6m-5 0a3 3 0 110 6H9l3 3-3-3zm1 3h4m-4 0a3 3 0 104 0m-4 0v3m4-3v3"></path>
      </svg>
    </div>
    <p class="text-xs font-bold uppercase tracking-wider text-mist mb-2">Valor do Estoque</p>
    <p class="font-display font-extrabold text-5xl text-ice tabular-nums">R$ {{ product_metrics.total_selling_price }}</p>
  </div>

  <!-- Total Profit Card (semântico: lucro = verde) -->
  <div class="bg-navy-800 border border-navy-700 rounded-card p-8 hover:border-lucro/40 transition-colors duration-200">
    <div class="w-11 h-11 rounded-control bg-lucro/15 flex items-center justify-center mb-6">
      <svg class="w-5 h-5 text-lucro" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
      </svg>
    </div>
    <p class="text-xs font-bold uppercase tracking-wider text-mist mb-2">Lucro do Estoque</p>
    <p class="font-display font-extrabold text-5xl text-ice tabular-nums">R$ {{ product_metrics.total_profit }}</p>
  </div>

</div>
