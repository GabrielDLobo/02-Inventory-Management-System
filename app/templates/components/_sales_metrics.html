<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">

  <!-- Total Sales Card -->
  <div class="bg-navy-800 border border-navy-700 rounded-card p-8 hover:border-sky-500/40 transition-colors duration-200">
    <div class="w-11 h-11 rounded-control bg-sky-500/15 flex items-center justify-center mb-6">
      <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
      </svg>
    </div>
    <p class="text-xs font-bold uppercase tracking-wider text-mist mb-2">Quantidade de Vendas</p>
    <p class="font-display font-extrabold text-5xl text-ice tabular-nums">{{ sales_metrics.total_sales }}</p>
  </div>

  <!-- Products Sold Card -->
  <div class="bg-navy-800 border border-navy-700 rounded-card p-8 hover:border-purple-500/40 transition-colors duration-200">
    <div class="w-11 h-11 rounded-control bg-purple-500/15 flex items-center justify-center mb-6">
      <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M8 11v6h8v-6M8 11h8"></path>
      </svg>
    </div>
    <p class="text-xs font-bold uppercase tracking-wider text-mist mb-2">Produtos Vendidos</p>
    <p class="font-display font-extrabold text-5xl text-ice tabular-nums">{{ sales_metrics.total_products_sold }}</p>
  </div>

  <!-- Sales Value Card -->
  <div class="bg-navy-800 border border-navy-700 rounded-card p-8 hover:border-sky-500/40 transition-colors duration-200">
    <div class="w-11 h-11 rounded-control bg-sky-500/15 flex items-center justify-center mb-6">
      <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
      </svg>
    </div>
    <p class="text-xs font-bold uppercase tracking-wider text-mist mb-2">Valor das Vendas</p>
    <p class="font-display font-extrabold text-5xl text-ice tabular-nums">R$ {{ sales_metrics.total_sales_value }}</p>
  </div>

  <!-- Sales Profit Card (semântico: lucro = verde) -->
  <div class="bg-navy-800 border border-navy-700 rounded-card p-8 hover:border-lucro/40 transition-colors duration-200">
    <div class="w-11 h-11 rounded-control bg-lucro/15 flex items-center justify-center mb-6">
      <svg class="w-5 h-5 text-lucro" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"></path>
      </svg>
    </div>
    <p class="text-xs font-bold uppercase tracking-wider text-mist mb-2">Lucro das Vendas</p>
    <p class="font-display font-extrabold text-5xl text-ice tabular-nums">R$ {{ sales_metrics.total_sales_profit }}</p>
  </div>

</div>
